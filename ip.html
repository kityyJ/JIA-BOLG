<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="查看当前 IP 或查询指定 IP 的公开网络信息。">
  <title>IP 查询 · JIA-BOLG</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./assets/css/ip.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="./" aria-label="JIA-BOLG 首页">JIA-BOLG</a>
      <a class="back-link" href="./"><span aria-hidden="true">←</span> 返回首页</a>
    </header>

    <main>
      <h1>IP 查询</h1>

      <section class="data-block" aria-labelledby="current-title">
        <h2 id="current-title">当前 IP</h2>
        <dl class="data-list">
          <div class="data-row"><dt>当前 IP</dt><dd id="current-ip">正在获取…</dd></div>
          <div class="data-row"><dt>位置</dt><dd id="current-location">正在获取…</dd></div>
          <div class="data-row"><dt>网络</dt><dd id="current-network">正在获取…</dd></div>
        </dl>
        <p class="status" id="current-status" role="status" aria-live="polite"></p>
      </section>

      <section class="query-section" aria-labelledby="query-title">
        <h2 id="query-title">查询其他 IP</h2>
        <form class="query-form" id="query-form">
          <label for="ip-input" hidden>输入 IP 地址</label>
          <input id="ip-input" name="ip" type="text" inputmode="text" autocomplete="off" placeholder="输入 IP 地址" aria-describedby="query-hint">
          <button id="query-button" type="submit">查询</button>
        </form>
        <p class="hint" id="query-hint">输入一个 IPv4 或 IPv6 地址以查询其公开网络信息。</p>
      </section>

      <section class="data-block" aria-labelledby="result-title">
        <h2 id="result-title">查询结果</h2>
        <dl class="data-list">
          <div class="data-row"><dt>IP 地址</dt><dd id="result-ip">等待查询</dd></div>
          <div class="data-row"><dt>位置</dt><dd id="result-location">等待查询</dd></div>
          <div class="data-row"><dt>网络</dt><dd id="result-network">等待查询</dd></div>
        </dl>
        <p class="status" id="query-status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script src="./assets/js/ip.js"></script>
</body>
</html>
