name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p             _site/assets/css             _site/assets/js             _site/assets/font             _site/assets/images

          cp index.html ip.html 404.html favicon.ico _site/
          cp assets/css/index.css assets/css/ip.css _site/assets/css/
          cp assets/js/index.js assets/js/ip.js _site/assets/js/
          cp assets/font/HYTiaoTiao.ttf _site/assets/font/
          cp assets/images/douyin-logo.svg _site/assets/images/
          cp assets/images/ip-query-logo.svg _site/assets/images/
          cp assets/images/refresh.gif _site/assets/images/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
