name: Purge deployment history

on:
  push:
    branches:
      - maintenance/purge-deployments
    paths:
      - .github/workflows/purge-deployments.yml

permissions:
  contents: read
  deployments: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all deployment records
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          deleted=0

          while true; do
            mapfile -t ids < <(
              gh api --paginate                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "repos/$REPO/deployments?per_page=100"                 --jq '.[].id'
            )

            if [ "${#ids[@]}" -eq 0 ]; then
              break
            fi

            pass_deleted=0

            for id in "${ids[@]}"; do
              gh api --method POST                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "repos/$REPO/deployments/$id/statuses"                 -f state=inactive                 -f description="Deployment history cleanup"                 >/dev/null 2>&1 || true

              if gh api --method DELETE                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "repos/$REPO/deployments/$id"                 >/dev/null 2>&1; then
                deleted=$((deleted + 1))
                pass_deleted=$((pass_deleted + 1))
              fi
            done

            if [ "$pass_deleted" -eq 0 ]; then
              echo "No additional deployments could be deleted."
              break
            fi
          done

          remaining="$(
            gh api --paginate               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "repos/$REPO/deployments?per_page=100"               --jq '.[].id' | wc -l | tr -d ' '
          )"

          echo "Deleted deployments: $deleted"
          echo "Remaining deployments: $remaining"

          if [ "$remaining" -ne 0 ]; then
            exit 1
          fi
